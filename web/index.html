body.elder{--fs:21px;--tile:150px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.5 "Noto Sans Tamil","Latha","Nirmala UI",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:110px;position:relative}
header{position:sticky;top:0;z-index:5;background:rgba(251,246,238,.96);backdrop-filter:blur(6px);color:var(--ink);padding:14px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:1.3em;margin:0;flex:1;font-weight:800;letter-spacing:.2px}
header small{display:block;font-size:.6em;color:var(--muted);font-weight:500}
.iconbtn{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:14px;min-width:44px;height:44px;font-size:1.1em;cursor:pointer;box-shadow:var(--shadow)}
main{padding:14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{font-size:1.05em;margin:0 0 8px}
.muted{color:var(--muted);font-size:.88em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;min-height:var(--tile);padding:16px;display:flex;flex-direction:column;
 justify-content:flex-start;align-items:flex-start;gap:10px;font-weight:700;font-size:1em;line-height:1.35;cursor:pointer;text-align:left;color:var(--ink);box-shadow:var(--shadow)}
.tile .ic{font-size:1.6em;line-height:1;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--teal-l);flex:none}
body.elder .tile .ic{font-size:2em;width:64px;height:64px;border-radius:18px}
.tiles .tile:nth-child(6n+1) .ic{background:#e8f1ff}.tiles .tile:nth-child(6n+2) .ic{background:#fff0e6}.tiles .tile:nth-child(6n+3) .ic{background:#eaf7ee}
.tiles .tile:nth-child(6n+4) .ic{background:#fdeaea}.tiles .tile:nth-child(6n+5) .ic{background:#f3ecff}.tiles .tile:nth-child(6n) .ic{background:#fff6d6}
.hello{padding:4px 4px 12px}.hello b{display:block;font-size:1.45em;font-weight:800;line-height:1.25}.hello span{color:var(--muted);font-size:.9em}
.next{background:linear-gradient(135deg,#e07a3f,#c9562a);color:#fff;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 8px 22px rgba(201,86,42,.28)}
.next small{opacity:.92;font-size:.85em;display:block}.next b{display:block;font-size:1.35em;margin:4px 0 12px;line-height:1.3}
.next .row{flex-wrap:nowrap}.next button{flex:1;font-weight:800}.next .ok{background:#fff;color:#a8441f}.next .later{background:rgba(255,255,255,.22);color:#fff}
.next.done{background:linear-gradient(135deg,#3f9a6b,#2f855a);box-shadow:0 8px 22px rgba(47,133,90,.25)}
.tipcard{background:#fff3d6;border-color:#f6e2b0}
.tile:active{transform:scale(.98)}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:calc(var(--tile)*.7)}
.tile.wide .ic{background:#f3ecff}
button,.btn{font:inherit;border-radius:14px;border:0;padding:12px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
body.elder button,body.elder .btn{padding:16px 18px}
.primary{background:var(--teal);color:#fff}.primary:active{background:var(--teal-d)}
.ghost{background:var(--teal-l);color:var(--teal-d)}
.danger{background:var(--red);color:#fff}
.plain{background:#fff;border:1px solid var(--line);color:var(--ink)}
.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.listen{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.listen button{padding:8px 14px;font-size:.85em;background:var(--teal-l);color:var(--teal-d);border-radius:999px}
body.elder .listen button{padding:12px 16px;font-size:.9em}
input,select,textarea{font:inherit;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
label{display:block;font-size:.88em;color:var(--muted);margin:10px 0 4px}
.sosfab{position:fixed;right:max(16px,calc(50% - 224px));bottom:20px;z-index:20;background:var(--red);color:#fff;border:0;border-radius:999px;
 height:64px;padding:0 24px;font-size:1.1em;font-weight:800;box-shadow:0 8px 20px rgba(192,57,43,.4)}
body.elder .sosfab{height:80px;padding:0 30px;font-size:1.3em}
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:30;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:1.3em}
.bigcall{width:100%;min-height:84px;font-size:1.25em;margin-top:12px;border-radius:18px}
body.elder .bigcall{min-height:104px;font-size:1.4em}
.midcall{width:100%;min-height:64px;margin-top:10px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8em;font-weight:700}
.p-HIGH{background:#fee2e2;color:var(--red-d)}.p-LOW{background:#dbeafe;color:#1d4ed8}.p-NORMAL{background:var(--green-l);color:var(--green)}.p-UNKNOWN{background:#f3f4f6;color:var(--muted)}
.res{border-left:5px solid var(--line)}
.res.HIGH{border-left-color:var(--red)}.res.LOW{border-left-color:#2563eb}.res.NORMAL{border-left-color:var(--green)}
.val{font-size:1.4em;font-weight:800}
.warn{background:var(--amber-l);color:#78350f;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.92em}
.alert{background:#fef2f2;border:2px solid #fecaca;color:#7f1d1d}
.calm{background:#eef5ff;border:2px solid #cfe0fb}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px}
.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:6px;border-radius:20px}
.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;border-radius:20px;box-shadow:var(--shadow)}
.askbar{position:sticky;bottom:96px;background:var(--bg);padding:8px 0;display:flex;gap:8px}
body.elder .askbar{bottom:112px}
.mic{min-width:56px;background:var(--teal);color:#fff;font-size:1.3em;border-radius:14px}
body.elder .mic{min-width:76px;font-size:1.7em}
.mic.on{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.dose{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.dose:last-child{border-bottom:0}
.dose .t{font-weight:800;font-size:1.15em;min-width:64px}
.dose .acts{display:flex;gap:6px}
.dose .acts button{padding:10px 12px}
body.elder .dose{flex-direction:column;align-items:stretch}
body.elder .dose .acts{width:100%}
body.elder .dose .acts button{flex:1;min-height:60px}
.st-taken{color:var(--green);font-weight:700}.st-missed{color:var(--red);font-weight:700}
.tabs{display:flex;gap:6px;overflow:auto;margin:0 0 12px;padding-bottom:2px}
.tabs button{white-space:nowrap;background:#fff;border:1px solid var(--line);color:var(--ink);padding:8px 12px;font-size:.9em}
.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#111827;color:#fff;padding:10px 16px;border-radius:12px;z-index:40;max-width:90%;display:none;font-size:.9em}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid #cbd5e1;border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500;font-size:.88em;padding:8px 12px;border-radius:999px}
.seg{display:flex;gap:8px}.seg button{flex:1;background:#fff;border:2px solid var(--line);color:var(--ink)}.seg button.on{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d)}
.hide{display:none!important}
.banner{background:var(--amber-l);border:1px solid #fcd34d;border-radius:14px;padding:12px;margin-bottom:12px}
.small{font-size:.82em}
a{color:var(--teal-d)}
</style>
</head>

/* ---------- helpers ---------- */
function deviceId(){let d=store.get("device","");
  if(!/^[a-z0-9]{12,40}$/.test(d)){d=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,"0")).join("");store.set("device",d)}
  return d}
async function api(path,body){
  const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({},body||{},{device:deviceId()}))});
  const j=await r.json();
  if(j.error==="invalid"){const e=new Error(j.detail);e.friendly=T[j.detail]?t(j.detail):t("error");throw e}
  if(j.error) throw new Error(j.detail||j.error); return j;
}
const todayLocal=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const nowHM=()=>new Date().toTimeString().slice(0,5);

function toast(msg,ms){const el=$("toast");el.textContent=msg;el.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display="none",ms||3500)}

/* ---------- voice out (browser speech, Tamil or English) ---------- */
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()}catch(e){VOICES=[]}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function voiceFor(lang){
  const vs=VOICES.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(lang==="ta"?"ta":"en"));
  if(lang==="en"){return vs.find(v=>/en-IN/i.test(v.lang))||vs.find(v=>/natural|google/i.test(v.name))||vs[0]}
  return vs.find(v=>/natural|online|google/i.test(v.name))||vs[0];
}
let AUD=null;
function speak(text,lang){
  stopSpeak();
  const hasSynth="speechSynthesis" in window;if(hasSynth)loadVoices();
  const v=hasSynth?voiceFor(lang):null;
  if(!v){serverSpeak(text,lang);return}
  const parts=String(text).replace(/\s+/g," ").match(/[^.!?।]+[.!?।]?/g)||[text];
  parts.forEach(p=>{const u=new SpeechSynthesisUtterance(p.trim());u.lang=lang==="ta"?"ta-IN":"en-IN";u.voice=v;u.rate=S.mode==="elder"?0.85:0.95;speechSynthesis.speak(u)});
}
async function serverSpeak(text,lang){
  toast("🔊 …",1500);
  try{const r=await api("/api/tts",{text,lang});AUD=new Audio(r.audio);AUD.playbackRate=S.mode==="elder"?0.95:1;await AUD.play()}
  catch(e){toast(t("no_ta_voice"),5000)}
}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}try{if(AUD){AUD.pause();AUD=null}}catch(e){}}

let SAY={};let sayN=0;
function listenBtns(o){
  const id="s"+(++sayN);SAY[id]=o;let h='<div class="listen">';
  const order=S.lang==="ta"?["ta","en"]:["en","ta"];
  for(const l of order){if(o[l])h+=`<button onclick="speak(SAY['${id}'].${l},'${l}')">${l==="ta"?T.listen_ta[L()]:T.listen_en[L()]}</button>`}
  return h+`<button onclick="stopSpeak()">${t("stop")}</button></div>`;
}

/* ---------- voice in ---------- */
let REC=null;
function startMic(btn,onText){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast(t("mic_unsupported"),5000);return}
  if(REC){REC.stop();return}
  stopSpeak();REC=new SR();REC.lang=S.lang==="ta"?"ta-IN":"en-IN";REC.interimResults=false;REC.maxAlternatives=1;
  btn.classList.add("on");toast(t("listening"),8000);
  REC.onresult=e=>{const txt=e.results[0][0].transcript;onText(txt)};
  REC.onerror=()=>toast(t("error"));
  REC.onend=()=>{btn.classList.remove("on");REC=null;$("toast").style.display="none"};
  REC.start();
}

let LOC="",PENDING_SHARE=false,SHARED_AT=0;
function getLoc(){return new Promise(res=>{if(!navigator.geolocation)return res("");
  navigator.geolocation.getCurrentPosition(p=>{LOC=`https://maps.google.com/?q=${p.coords.latitude.toFixed(5)},${p.coords.longitude.toFixed(5)}`;res(LOC)},()=>res(LOC),{enableHighAccuracy:true,timeout:10000,maximumAge:60000})})}
function waLink(){const num=(S.famPhone||"").replace(/\D/g,"");const to=num?(num.length===10?"91"+num:num):"";
  return `https://wa.me/${to}?text=${encodeURIComponent(t("whatsapp_msg")+" "+(LOC||"-"))}`}
function openSOS(mode){
  stopSpeak();getLoc();
  const fam=S.famPhone?`<a class="btn danger bigcall" href="tel:${esc(S.famPhone)}" onclick="armShare()">👨‍👩‍👧 ${t("call_family")}${S.famName?" · "+esc(S.famName):""}</a>`
                      :`<div class="banner small">${t("no_family")}</div>`;
  const extra=mode==="distress"?`<a class="btn primary midcall" href="tel:14416" onclick="armShare()">${t("call_14416")}</a>`:"";
  $("sosSheet").innerHTML=`<h2>🆘 ${t("sos_title")}</h2><div class="muted">${t("sos_sub")}</div>
   ${fam}${extra}
   <a class="btn plain midcall" style="border:2px solid var(--red);color:var(--red-d)" href="tel:108" onclick="armShare()">🚑 ${t("call_108")}</a>
   ${S.famPhone?`<div class="muted small" style="margin-top:8px">📍 ${t("auto_loc")}</div>`:""}
   <button class="ghost midcall" onclick="shareLocation()">${t("share_loc")}</button>
   <button class="plain midcall" onclick="closeSOS()">${t("close")}</button>`;
  $("sos").classList.add("on");
}
function armShare(){if(S.famPhone)PENDING_SHARE=true}
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState!=="visible"||!PENDING_SHARE)return;
  PENDING_SHARE=false;await getLoc();shareNow();
});
function shareNow(){if(Date.now()-SHARED_AT<5000)return;SHARED_AT=Date.now();window.location.href=waLink()}
function closeSOS(){$("sos").classList.remove("on")}
async function shareLocation(){await getLoc();if(!LOC)toast(t("loc_fail"));shareNow()}

function pickFile(cb){const f=$("filePick");f.value="";f.onchange=()=>{if(f.files[0])prepFile(f.files[0]).then(cb).catch(()=>toast(t("error")))};f.click()}
function prepFile(file){
  return new Promise((res,rej)=>{
    if(file.type==="application/pdf"){if(file.size>4.5e6){toast(t("too_big"));return rej()}const r=new FileReader();r.onload=()=>res({filename:file.name,data:r.result,preview:""});r.onerror=rej;r.readAsDataURL(file);return}
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const max=1800;let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      const data=c.toDataURL("image/jpeg",0.85);URL.revokeObjectURL(url);res({filename:"photo.jpg",data,preview:data})};
    img.onerror=rej;img.src=url;
  });
}

    h+=`<div class="card ${x.unsure?"res HIGH":"res NORMAL"}"><b>${i+1}. ${esc(x.name)} ${esc(x.dose)}</b>
      ${x.use_en?`<div class="muted" style="margin-top:4px">💊 ${t("for_label")} ${esc(pick({ta:x.use_ta,en:x.use_en}))}</div>`:""}
      <div style="margin-top:4px">${esc(pick(o))}</div>${x.unsure?`<div class="warn">${t("rx_unsure")}</div>`:""}${listenBtns(o)}
      <label class="row" style="color:var(--ink);margin-top:10px"><input type="checkbox" id="rxc${i}" style="width:auto" ${x.unsure||!x.times.length?"":"checked"}> ${t("save")}</label>
      <div class="row"><input id="rxt${i}" value="${esc(x.times.join(", "))}" placeholder="08:00, 20:00" style="flex:1">
      <select id="rxf${i}" style="flex:1"><option value="">${t("none")}</option><option value="before" ${x.food==="before"?"selected":""}>${t("before")}</option><option value="after" ${x.food==="after"?"selected":""}>${t("after")}</option></select></div></div>`});
  const all={ta:r.rows.map(x=>x.ta).join(". ")+". "+r.disclaimer.ta,en:r.rows.map(x=>x.en).join(". ")+". "+r.disclaimer.en};
  h+=`<div class="card"><div class="muted small">${esc(pick(r.disclaimer))}</div>${listenBtns(all)}
     <label>${t("rx_for")}</label>${personSelect("rxPerson",false)}<div class="muted small">${t("rx_hint")}</div>
     <button class="primary block" style="margin-top:10px" onclick="saveRx()">${t("rx_save")}</button></div>`;
  return h;
}
async function saveRx(){
  const p=$("rxPerson")&&$("rxPerson").value;if(!p){toast(t("pick_person"));return}
  const okT=s=>{const m=s.match(/^(\d{1,2}):(\d{2})$/);return m&&+m[1]<=23&&+m[2]<=59};
  for(let i=0;i<RX.rows.length;i++){if(!$("rxc"+i).checked)continue;
    const raw=$("rxt"+i).value.split(/[,\s]+/).filter(Boolean);if(!raw.length||!raw.every(okT)){$("rxt"+i).focus();return bad("bad_time")}}
  for(let i=0;i<RX.rows.length;i++){if(!$("rxc"+i).checked)continue;const x=RX.rows[i];
    const times=$("rxt"+i).value.split(/[,\s]+/).filter(Boolean);
    try{await api("/api/med/add",{profile:p,name:x.name,dose:x.dose,times,food:$("rxf"+i).value})}catch(e){return toast(e.friendly||t("error"))}}
  toast(t("saved"));
}

/* ---------- family care ---------- */
function viewCare(){
  const ps=(S.boot&&S.boot.profiles)||[];
  const tabs=["today","medicines","appointments","visits","reports"];
  const pickH=ps.length?`<div class="row">${personSelect("carePerson",false)}</div>`:"";
  return `<div class="card"><h2>💊 ${S.view==="meds"?t("home_meds"):t("care_title")}</h2>${pickH}
   <details style="margin-top:8px"><summary class="muted">${t("add_person")}</summary>
   <label>${t("name")}</label><input id="npName"><label>${t("relation")}</label><input id="npRel"><label>${t("age")}</label><input id="npAge" inputmode="numeric">
   <button class="primary" style="margin-top:10px" onclick="addPerson()">${t("save")}</button></details></div>
   ${S.view==="meds"&&S.mode==="elder"?"":`<div class="tabs">${tabs.map(x=>`<button class="${S.careTab===x?"on":""}" onclick="S.careTab='${x}';drawCare()">${t(x)}</button>`).join("")}</div>`}
   <div id="careOut"><div class="card"><span class="spinner"></span></div></div>`;
}
async function addPerson(){
  const name=$("npName").value.trim();if(!name)return;
  await api("/api/profile/add",{name,relation:$("npRel").value.trim(),age:$("npAge").value});
  if(!S.person){S.person=name;store.set("person",name)}S.person=name;await boot();render();
}
async function loadProfile(){
  const sel=$("carePerson");if(sel)sel.onchange=()=>{if(sel.value==="__add")return;S.person=sel.value;store.set("person",S.person);loadProfile()};
  const p=sel?sel.value:"";if(!p){$("careOut").innerHTML=`<div class="card muted">${t("pick_person")}</div>`;return}
  try{S.profile=await api("/api/profile/get",{profile:p});drawCare()}catch(e){$("careOut").innerHTML=`<div class="card">${t("error")}</div>`}
}
function foodTxt(f){return f==="before"?t("before"):f==="after"?t("after"):""}
function drawCare(){
  const P=S.profile;if(!P)return;const tab=(S.view==="meds"&&S.mode==="elder")?"today":S.careTab;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.textContent===t(tab)));
  let h="";const who=esc(P.profile.name);
  if(tab==="today"){
    const d=P.today;const a=P.adherence;
    h=`<div class="card"><h2>${who} · ${t("today")}</h2>${d.length?d.map(x=>{const o={ta:`${x.time}. ${x.medicine} ${x.dose_text}. ${foodTxtL(x.food,"ta")}`,en:`${x.time}. ${x.medicine} ${x.dose_text}. ${foodTxtL(x.food,"en")}`};
      return `<div class="dose"><div><div class="t">${esc(x.time)}</div><b>${esc(x.medicine)}</b> <span class="muted small">${esc(x.dose_text)} ${foodTxt(x.food)}</span>
       ${x.status!=="pending"?`<div class="st-${x.status}">${t("st_"+x.status)}</div>`:""}</div>
       <div class="acts"><button class="ghost" onclick="setDose('${esc(x.medicine)}','${x.time}',true)">${t("taken")}</button><button class="plain" onclick="setDose('${esc(x.medicine)}','${x.time}',false)">${S.mode==="elder"?"❌":t("missed")}</button>
       <button class="plain" onclick='speak(${JSON.stringify(S.lang==="ta"?o.ta:o.en)},"${S.lang}")'>🔊</button></div></div>`}).join(""):`<div class="muted">${t("no_doses")}</div>`}
      ${a.total?`<div class="muted" style="margin-top:8px">${t("adherence")}: <b>${a.adherence}%</b> (${a.taken}/${a.total})</div>`:""}
      <div class="muted small" style="margin-top:6px">${t("reminder_note")}</div></div>`;
    if(S.view==="meds"&&S.mode==="elder")h+=`<button class="ghost block" onclick="S.careTab='medicines';S.view='care';render()">${t("add_med")}</button>`;
  }
  if(tab==="medicines"){
    h=`<div class="card"><h2>${t("medicines")}</h2>${P.medicines.length?P.medicines.map(m=>`<div class="dose"><div><b>${esc(m.name)}</b> <span class="muted small">${esc(m.dose_text)}</span><div class="muted small">${esc((m.times||[]).join(", "))} ${foodTxt(m.food)}</div></div>
      <button class="plain" onclick="delMed('${esc(m.name)}')">${t("del")}</button></div>`).join(""):`<div class="muted">${t("no_items")}</div>`}</div>
      <div class="card"><h2>${t("add_med")}</h2><label>${t("med_name")}</label><input id="mName"><label>${t("dose")}</label><input id="mDose" placeholder="500 mg">
      <label>${t("times")}</label><input id="mTimes" placeholder="08:00, 20:00"><label>${t("food")}</label>
      <select id="mFood"><option value="">${t("none")}</option><option value="before">${t("before")}</option><option value="after">${t("after")}</option></select>
      <button class="primary block" style="margin-top:12px" onclick="addMed()">${t("save")}</button></div>`;
  }
  if(tab==="appointments"){
    const ap=[...P.appointments].sort((a,b)=>a.date.localeCompare(b.date));
    h=`<div class="card"><h2>${t("appointments")}</h2>${ap.length?ap.map((x,i)=>`<div class="dose"><div><b>${esc(x.date)} ${esc(x.time)}</b><div>${esc(x.doctor_or_hospital)}</div><div class="muted small">${esc(x.note)}</div></div><button class="plain" onclick="delAppt(${i})">${t("del")}</button></div>`).join(""):`<div class="muted">${t("no_items")}</div>`}</div>
     <div class="card"><h2>${t("add_appt")}</h2><label>${t("date")}</label><input type="date" id="aDate" min="${todayLocal()}"><label>${t("time")}</label><input type="time" id="aTime">
     <label>${t("where")}</label><input id="aWhere"><label>${t("note")}</label><input id="aNote"><button class="primary block" style="margin-top:12px" onclick="addAppt()">${t("save")}</button></div>`;
  }
  if(tab==="visits"){
    h=`<div class="card"><h2>${t("add_visit")}</h2><div class="muted small">${t("visit_hint")}</div><label>${t("date")}</label><input type="date" id="vDate" max="${todayLocal()}" value="${todayLocal()}">
     <label>${t("where")}</label><input id="vWhere"><label>${t("symptoms")}</label><textarea id="vSym" rows="2"></textarea><label>${t("doctor_notes")}</label><textarea id="vNotes" rows="3"></textarea>
     <button class="ghost block" style="margin-top:12px" onclick="pickVisitPhoto()">${t("add_rx_photo")}</button><div id="vPhotoPrev"></div>
     <button class="primary block" style="margin-top:12px" onclick="addVisit()">${t("save")}</button></div>`+
     (P.visits.length?P.visits.map(v=>`<div class="card"><h2>🩺 ${esc(v.date)} · ${esc(v.doctor_or_hospital)}</h2>
       ${v.symptoms?`<div><b class="small">${t("symptoms")}:</b> ${esc(v.symptoms)}</div>`:""}${v.doctor_notes?`<div><b class="small">${t("doctor_notes")}:</b> ${esc(v.doctor_notes)}</div>`:""}
       ${v.medicines.length?`<div style="margin-top:6px"><b class="small">${t("visit_meds")}:</b> ${v.medicines.map(m=>esc(m.name+" "+m.dose_text)).join(", ")}</div>`:""}
       ${v.abnormal_results.length?`<div style="margin-top:6px"><b class="small">${t("visit_abn")} (${esc(v.report_date)}):</b> ${v.abnormal_results.map(r=>`${esc(r.test)} ${esc(r.value)} <span class="pill p-${r.status}">${t(r.status)}</span>`).join(" ")}</div>`:""}
       ${v.photo?(v.photo.endsWith(".pdf")?`<a class="btn ghost" style="margin-top:8px" href="/photo/${esc(v.photo)}" target="_blank">${t("view_photo")}</a>`:`<a href="/photo/${esc(v.photo)}" target="_blank"><img src="/photo/${esc(v.photo)}" alt="" style="width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-top:8px;border:1px solid var(--line)"></a>`):""}
       <button class="ghost" style="margin-top:8px" onclick="window.print()">🖨️</button></div>`).join(""):`<div class="card muted">${t("no_items")}</div>`);
  }
  if(tab==="reports"){
    const hist=P.lab_history;
    const tests=[...new Set(hist.flatMap(r=>r.results.map(x=>x.test)))];
    h=`<div class="card"><h2>${t("history_title")}</h2>${hist.length?hist.map(r=>`<div style="margin-bottom:10px"><b>${esc(r.date)}</b><div>${r.results.map(x=>`${esc(x.test)} ${esc(x.value)} <span class="pill p-${x.status}">${t(x.status)}</span>`).join(" · ")}</div></div>`).join(""):`<div class="muted">${t("no_items")}</div>`}</div>
      ${tests.length?`<div class="card"><h2>${t("compare")}</h2><select id="hTest">${tests.map(x=>`<option>${esc(x)}</option>`).join("")}</select><button class="ghost block" style="margin-top:8px" onclick="compareTest()">${t("compare")}</button><div id="hOut"></div></div>`:""}`;
  }
  $("careOut").innerHTML=h;
}
function foodTxtL(f,l){return f==="before"?T.before[l==="ta"?0:1]:f==="after"?T.after[l==="ta"?0:1]:""}
const P=()=>S.profile.profile.name;
async function setDose(name,time,taken){S.profile=await api("/api/dose",{profile:P(),name,time,taken});drawCare()}
async function delMed(name){if(!confirm(t("del")+"?"))return;S.profile=await api("/api/med/delete",{profile:P(),name});drawCare()}
async function addMed(){const name=$("mName").value.trim();if(!name)return;
  const raw=$("mTimes").value.split(/[,\s]+/).filter(Boolean);
  if(!raw.length||raw.some(s=>{const m=s.match(/^(\d{1,2}):(\d{2})$/);return !m||+m[1]>23||+m[2]>59}))return bad("bad_time");
  try{S.profile=await api("/api/med/add",{profile:P(),name,dose:$("mDose").value.trim(),times:raw,food:$("mFood").value});toast(t("saved"));drawCare()}catch(e){toast(e.friendly||t("error"))}}
async function addAppt(){const d=$("aDate").value,tm=$("aTime").value;if(!d)return bad("bad_date");
  if(d<todayLocal())return bad("past_date");if(d===todayLocal()&&tm&&tm<nowHM())return bad("past_time");
  try{S.profile=await api("/api/appt/add",{profile:P(),date:d,time:tm,where:$("aWhere").value,note:$("aNote").value});toast(t("saved"));drawCare()}catch(e){toast(e.friendly||t("error"))}}
async function delAppt(i){S.profile=await api("/api/appt/delete",{profile:P(),index:i});drawCare()}
function pickVisitPhoto(){pickFile(f=>{S.visitPhoto=f;const el=$("vPhotoPrev");if(!el)return;
  el.innerHTML=(f.preview?`<img src="${f.preview}" alt="" style="max-width:100%;border-radius:14px;margin-top:8px">`:"📄 PDF")+`<div class="muted small">${t("photo_added")}</div>`})}
async function addVisit(){const d=$("vDate").value||todayLocal();if(d>todayLocal())return bad("future_date");
  try{S.profile=await api("/api/visit/add",{profile:P(),date:d,where:$("vWhere").value,symptoms:$("vSym").value,notes:$("vNotes").value,photo:S.visitPhoto?S.visitPhoto.data:""});
    S.visitPhoto=null;toast(t("saved"));drawCare()}catch(e){toast(e.friendly||t("error"))}}
async function compareTest(){const r=await api("/api/history",{profile:P(),test:$("hTest").value});
  $("hOut").innerHTML=r.can_compare?`<div style="margin-top:8px">${r.history.map(x=>`${esc(x.date)}: <b>${esc(x.value)} ${esc(r.unit)}</b> <span class="pill p-${x.status}">${t(x.status)}</span>`).join("<br>")}</div>`:`<div class="muted" style="margin-top:8px">${t("cannot_compare")}</div>`}

/* ---------- hospitals ---------- */
function viewHosp(){
  const c=S.boot?S.boot.care:{emergency:[],places:[],near_me:[]};
  return `<div class="card"><h2>🚨 ${t("emergency_numbers")}</h2>${c.emergency.map(e=>`<div class="dose"><div><b>${esc(e.number)}</b><div class="muted small">${esc(pick(e))}</div></div><a class="btn danger" href="tel:${esc(e.number)}">${t("call")}</a></div>`).join("")}</div>
   <div class="card"><h2>📍 ${t("near_me")}</h2>${c.near_me.map(n=>`<div class="dose"><div>${esc(pick(n))}</div><a class="btn ghost" target="_blank" rel="noopener" href="${esc(n.maps)}">${t("open_map")}</a></div>`).join("")}</div>
   <div class="card"><h2>🏥 ${t("places")}</h2>${c.places.map(p=>`<div class="dose"><div><b>${esc(p.name)}</b><div class="muted small">${esc(p.city)}</div></div><a class="btn ghost" target="_blank" rel="noopener" href="${esc(p.maps)}">${t("open_map")}</a></div>`).join("")}</div>`;
}

/* ---------- myths ---------- */
function viewMyth(){
  const ms=S.boot?S.boot.myths:[];
  return `<div class="card"><h2>🧐 ${t("myth_title")}</h2><div class="muted small">${t("myth_tap")}</div></div>`+
   ms.map(m=>{const o={ta:`${m.myth_ta} ${T.verdict[0]}: ${m.verdict_ta}. ${m.ta}`,en:`${m.myth_en} Verdict: ${m.verdict_en}. ${m.en}`};
    return `<details class="card"><summary><b>“${esc(pick({ta:m.myth_ta,en:m.myth_en}))}”</b></summary><div style="margin:8px 0"><span class="pill p-HIGH">${esc(pick({ta:m.verdict_ta,en:m.verdict_en}))}</span></div>${esc(pick(m))}${m.source?`<div class="muted small" style="margin-top:4px">📚 <a href="${esc(m.source)}" target="_blank" rel="noopener">${t("source")}</a></div>`:""}${listenBtns(o)}</details>`}).join("");
}

/* ---------- schemes ---------- */
function viewScheme(){
  const sc=S.boot?S.boot.schemes:[];const f=S.boot?S.boot.scheme_footer:{};
  return sc.map(s=>{const o={ta:`${s.name_ta}. ${s.ta} ${T.rules[0]}: ${s.rules.map(r=>r.ta).join(" ")} ${T.docs[0]}: ${s.documents.map(d=>d.ta).join(", ")}. ${s.where.ta}`,
                           en:`${s.name_en}. ${s.en} Rules: ${s.rules.map(r=>r.en).join(" ")} Documents: ${s.documents.map(d=>d.en).join(", ")}. ${s.where.en}`};
    return `<div class="card"><h2>🛡️ ${esc(pick({ta:s.name_ta,en:s.name_en}))}</h2><div>${esc(pick(s))}</div>
     <h2 style="margin-top:12px">${t("rules")}</h2><ul>${s.rules.map(r=>`<li>${esc(pick(r))}</li>`).join("")}</ul>
     <h2>${t("docs")}</h2><ul>${s.documents.map(d=>`<li>${esc(pick(d))}</li>`).join("")}</ul>
     <h2>${t("where_apply")}</h2><div>${esc(pick(s.where))}</div><a class="btn ghost" style="margin-top:8px" target="_blank" rel="noopener" href="${esc(s.url)}">${t("official_site")}</a>${listenBtns(o)}</div>`}).join("")+
   `<div class="card muted small">${esc(pick(f))}</div>`;
}

/* ---------- mental health ---------- */
function viewMind(){
  const all={ta:[T.mind_intro[0],T.mind_line[0],...MIND_STEPS.map(x=>x.ta),T.mind_danger[0]].join(" "),en:[T.mind_intro[1],T.mind_line[1],...MIND_STEPS.map(x=>x.en),T.mind_danger[1]].join(" ")};
  return `<div class="card calm"><h2>💙 ${t("home_mind")}</h2><div>${t("mind_intro")}</div>${listenBtns(all)}</div>
   <div class="card"><div>${t("mind_line")}</div><a class="btn primary bigcall" href="tel:14416">${t("call_14416")}</a>
   ${S.famPhone?`<a class="btn plain midcall" href="tel:${esc(S.famPhone)}">👨‍👩‍👧 ${t("call_family")}${S.famName?" · "+esc(S.famName):""}</a>`:""}</div>
   <div class="card"><h2>🌿 ${t("mind_steps_title")}</h2><ol>${MIND_STEPS.map(x=>`<li style="margin-bottom:6px">${esc(pick(x))}</li>`).join("")}</ol></div>
   <div class="card alert"><b>${t("mind_danger")}</b><div class="row" style="margin-top:10px"><a class="btn primary" href="tel:14416">${t("call_14416")}</a><a class="btn danger" href="tel:112">${t("call_112")}</a></div></div>`;
}

/* ---------- settings ---------- */
async function addPersonFromSelect(sel){
  const name=(prompt(S.lang==="ta"?"பெயர் (எ.கா. பாட்டி)":"Name (e.g. Paati)")||"").trim();
  if(!name){sel.value=S.person||"";return null}
  try{await api("/api/profile/add",{name,relation:name,age:0});await boot();toast(t("saved"));return name}catch(e){toast(t("error"));return null}
}
document.addEventListener("change",async e=>{
  const el=e.target; if(!el||el.tagName!=="SELECT"||el.value!=="__add")return;
  const name=await addPersonFromSelect(el); if(!name)return;
  // refresh this dropdown in place (keeps any report / prescription results on screen)
  const hadNone=!!el.querySelector('option[value=""]');
  el.innerHTML=personSelect(el.id,hadNone).replace(/^<select[^>]*>|<\/select>$/g,"");
  el.value=name;
  if(el.id==="sPerson"||el.id==="carePerson"){S.person=name;store.set("person",name)}
  if(el.id==="carePerson")loadProfile();
});
document.addEventListener("change",e=>{if(e.target.id==="sPerson"&&e.target.value!=="__add"){S.person=e.target.value;store.set("person",S.person)}});

/* ---------- reminders (only while the app is open) ---------- */
let RANG={};
async function checkReminders(){
  if(!S.person||!S.onboarded)return;
  try{const p=await api("/api/profile/get",{profile:S.person});const now=new Date();const hm=now.toTimeString().slice(0,5);
    for(const d of p.today){const key=now.toDateString()+d.medicine+d.time;
      if(d.status==="pending"&&d.time<=hm&&!RANG[key]){const [hh,mm]=d.time.split(":").map(Number);const mins=(now.getHours()*60+now.getMinutes())-(hh*60+mm);
        if(mins>=0&&mins<=2){RANG[key]=1;beep();const msg=`${t("reminder")} ${d.medicine} ${d.dose_text} (${d.time})`;toast(msg,10000);speak(msg,S.lang);
          try{if(Notification.permission==="granted")new Notification("Nalam AI",{body:msg})}catch(e){}}}}}catch(e){}
}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,0.35,0.7].forEach(s=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.value=.2;o.start(a.currentTime+s);o.stop(a.currentTime+s+.2)})}catch(e){}}

/* ---------- start ---------- */
async function boot(){try{S.boot=await api("/api/bootstrap",{})}catch(e){S.boot=null}}
(async()=>{await boot();render();setInterval(checkReminders,30000);
  try{if("Notification" in window&&Notification.permission==="default")document.addEventListener("click",()=>Notification.requestPermission(),{once:true})}catch(e){}})();
</script>
